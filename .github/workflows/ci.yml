name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit & integration (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  redis-compat:
    name: Compatibility with official redis-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y redis-tools
      - run: bash test/redis-cli.sh

  docker:
    name: Docker image with docker compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y redis-tools
      - name: Build and start
        run: docker compose up --build -d
      - name: Check it answers redis-cli
        run: |
          for _ in $(seq 30); do redis-cli PING 2>/dev/null | grep -q PONG && break; sleep 1; done
          redis-cli PING | grep -x PONG
          redis-cli SET greeting "hello world" | grep -x OK
          redis-cli GET greeting | grep -x "hello world"
      - name: Check the key survives a new container
        run: |
          docker compose stop
          docker compose logs | grep "received SIGTERM, saving"
          docker compose down
          docker compose up -d
          for _ in $(seq 30); do redis-cli PING 2>/dev/null | grep -q PONG && break; sleep 1; done
          redis-cli GET greeting | grep -x "hello world"
      - name: Show logs
        if: always()
        run: docker compose logs
